# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    # PostgreSQL is a supported production backend, so the shared
    # backend conformance suite has to run against a real server here —
    # without one it skips and reports the same green as a passing run.
    services:
      postgres:
        # Pinned to an exact patch release: a floating tag is a test
        # fixture that changes under you, and it will change on a day
        # you are debugging something else. releng/with-postgres.sh
        # defaults to the same tag so local runs match. Bump both.
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v -race
        env:
          DIRQ_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2

      - name: Cross-compile Linux amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/dirq-server ./cmd/dirq-agent ./cmd/dirq

      - name: Cross-compile Windows amd64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./cmd/dirq-agent

  collection-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Ansible
        run: pip install ansible-core

      - name: Build collection
        working-directory: collection/atgreen/dirq
        run: ansible-galaxy collection build --force

      - name: Install collection
        working-directory: collection/atgreen/dirq
        run: ansible-galaxy collection install atgreen-dirq-*.tar.gz

      - name: Verify collection
        run: ansible-doc -t connection atgreen.dirq.dirq > /dev/null
