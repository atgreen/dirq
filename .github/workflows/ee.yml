# SPDX-License-Identifier: MIT
#
# Build and publish the DirQ Ansible Execution Environment image.
# Triggers on the same tag push as release.yml so the EE always tracks
# the matching dirq release. Uses ansible-builder against the top-level
# execution-environment.yml (same file local devs use), so CI and local
# builds produce equivalent images.

name: Execution Environment

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-ee:
    name: Build and push EE to ghcr.io
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/dirq-ee
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-builder and ansible-core
        run: pip install --upgrade pip ansible-builder ansible-core

      - name: Build collection tarball from this workspace
        working-directory: collection/atgreen/dirq
        run: ansible-galaxy collection build --force

      - name: Stage tarball for ansible-builder
        run: |
          cp collection/atgreen/dirq/atgreen-dirq-*.tar.gz atgreen-dirq.tar.gz

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build EE image
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          ansible-builder build \
            --file execution-environment.yml \
            --container-runtime podman \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            --verbosity 2

      - name: Verify ansible-core version and collection install
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          podman run --rm "${IMAGE}:${VERSION}" ansible --version
          podman run --rm "${IMAGE}:${VERSION}" \
            ansible-galaxy collection list atgreen.dirq

      - name: Push EE image
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          podman push "${IMAGE}:${VERSION}"
          podman push "${IMAGE}:latest"
