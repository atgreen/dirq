# No need to specify connection: dirq — the inventory plugin sets
# ansible_connection automatically for exec-enabled hosts.

---
- name: Test DirQ connection
  hosts: all
  gather_facts: false

  tasks:
    - name: Run whoami
      raw: whoami
      register: result

    - name: Show whoami output
      debug:
        msg: "I am: {{ result.stdout | trim }}"

    - name: Get uptime
      raw: uptime
      register: uptime_result

    - name: Show uptime
      debug:
        msg: "{{ uptime_result.stdout | trim }}"

    - name: Check kernel version
      raw: uname -r
      register: kernel

    - name: Show kernel
      debug:
        msg: "Kernel: {{ kernel.stdout | trim }}"

    - name: Show standard Ansible vars set by DirQ inventory
      debug:
        msg: >
          OS={{ ansible_os_family }},
          Distro={{ ansible_distribution }},
          Arch={{ ansible_architecture }},
          CPUs={{ ansible_processor_vcpus }},
          RAM={{ ansible_memtotal_mb }}MB
