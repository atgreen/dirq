# DirQ Server Configuration
#
# Edit this file, then restart the service:
#   sudo systemctl restart dirq-server
#
# Environment variables override these settings (e.g. DIRQ_DB_URL).
# See: https://github.com/atgreen/dirq

# gRPC address for agent connections.
grpc_addr: :50051

# HTTP/REST API address.
http_addr: :8080

# Database URL. SQLite is the default; use postgres:// for PostgreSQL.
db_url: sqlite:///var/lib/dirq/dirq.db

# TLS certificates. Auto-generated if not specified.
# tls_ca: /etc/dirq/ca.crt
# tls_cert: /etc/dirq/server.crt
# tls_key: /etc/dirq/server.key

# Topology tuning (0 = automatic defaults).
# max_zone_leaders: 0
# max_children: 0

# Require agents to present this secret during registration.
# registration_secret:

# Set to true to disable API token authentication (NOT recommended).
# auth_disabled: false

# Require every write operation (exec/put/fetch/deploy) to assert an aap_user
# that the calling token is bound to. Defaults to false (binding is opt-in per
# token). Set true for regulated deployments: unbound tokens then cannot perform
# write operations — mint per-service-account tokens with
# `dirq token create <name> --aap-user <name>`.
# require_aap_binding: false
