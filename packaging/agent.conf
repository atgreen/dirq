# DirQ Agent Configuration
#
# Edit this file, then restart the service:
#   sudo systemctl restart dirq-agent
#
# Environment variables in /etc/sysconfig/dirq-agent override these settings.
# See: https://github.com/atgreen/dirq

server: localhost:50051
listen: 0.0.0.0:50052
exec_enabled: false

# Optional agent-side OPA/Rego policy (defense in depth). When unset, behavior
# is unchanged — exec_enabled alone gates operations. When set, the policy is
# evaluated on the agent before any exec, file, or deploy side effect.
#
# Example policies ship under examples/policy/ (minimal allowlist, production
# AAP-only exec, and file path restrictions).
#
#   policy_file: /etc/dirq/policy.rego
#
# Deny when the policy fails to load or evaluate. Defaults to true once
# policy_file is set, so a misconfigured production agent fails safe. Set to
# false for a discovery period on lab hosts.
#
#   policy_fail_closed: true
#
# Rego decision query. Defaults to data.dirq.agent.allow.
#
#   policy_query: data.dirq.agent.allow

tags:
  os: linux
