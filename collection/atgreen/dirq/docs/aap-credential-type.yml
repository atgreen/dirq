#
# DirQ Credential Type for AAP / AWX
#
# Import this in AAP under Administration > Credential Types.
# Then create credentials of this type with your DirQ server URL and token.

---
name: DirQ Credential
description: Credentials for connecting to a DirQ server
kind: cloud

inputs:
  fields:
    - id: dirq_server_url
      type: string
      label: DirQ Server URL
      help_text: "Full URL of the DirQ server REST API (e.g. http://dirq-server:8080)"
    - id: dirq_token
      type: string
      label: DirQ API Token
      secret: true
      help_text: "API token generated with 'dirq token create'"
  required:
    - dirq_server_url
    - dirq_token

injectors:
  env:
    DIRQ_SERVER_URL: "{{ dirq_server_url }}"
    DIRQ_TOKEN: "{{ dirq_token }}"
