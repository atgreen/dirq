#
# Local demo fleet — run with: make demo
# Stop with:                   make demo-down
#
# Creates a server pod (postgres + dirq-server) and 10 agent pods,
# all on a shared podman network with TLS and authentication enabled.

apiVersion: v1
kind: Pod
metadata:
  name: dirq-server
  labels:
    app: dirq-server
spec:
  volumes:
    - name: certs
      hostPath:
        path: DEMO_CERTS_DIR
  containers:
    - name: postgres
      image: docker.io/library/postgres:17
      env:
        - name: POSTGRES_USER
          value: dirq
        - name: POSTGRES_PASSWORD
          value: dirq
        - name: POSTGRES_DB
          value: dirq

    - name: server
      image: localhost/dirq-server:dev
      volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
      env:
        - name: DIRQ_GRPC_ADDR
          value: ":50051"
        - name: DIRQ_HTTP_ADDR
          value: ":8080"
        - name: DIRQ_DB_URL
          value: "postgres://dirq:dirq@localhost:5432/dirq?sslmode=disable"
        - name: DIRQ_POD_ID
          value: "demo-server"
        - name: DIRQ_TLS_CA
          value: "/certs/ca.crt"
        - name: DIRQ_TLS_CERT
          value: "/certs/server.crt"
        - name: DIRQ_TLS_KEY
          value: "/certs/server.key"
      ports:
        - containerPort: 50051
          hostPort: 19051
        - containerPort: 8080
          hostPort: 19080
---
apiVersion: v1
kind: Pod
metadata:
  name: dirq-agent-01
  labels:
    app: dirq-agent
spec:
  volumes:
    - name: certs
      hostPath:
        path: DEMO_CERTS_DIR
  containers:
    - name: agent
      image: localhost/dirq-agent:dev
      volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
      env:
        - name: DIRQ_SERVER
          value: "dirq-server:50051"
        - name: DIRQ_EXEC_ENABLED
          value: "true"
        - name: DIRQ_TLS_CA
          value: "/certs/ca.crt"
        - name: DIRQ_TLS_CERT
          value: "/certs/agent.crt"
        - name: DIRQ_TLS_KEY
          value: "/certs/agent.key"
        - name: DIRQ_TAGS
          value: "env=prod,role=webserver"
---
