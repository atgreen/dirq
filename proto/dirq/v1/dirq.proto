syntax = "proto3";

package dirq.v1;

option go_package = "github.com/atgreen/dirq/proto/dirq/v1;dirqv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// ─────────────────────────────────────────────────────────
// Agent ↔ Server  (bootstrap + zone-leader connections)
// ─────────────────────────────────────────────────────────

service DirQServer {
  // Agent calls this once at startup to register and get its peer assignment.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Zone leaders maintain a persistent bidirectional stream with the server.
  // Server pushes queries down; zone leader streams results back.
  rpc AgentStream(stream AgentMessage) returns (stream ServerMessage);

  // Agent calls this when it loses all peers and needs reassignment.
  rpc RequestPeers(PeerRequest) returns (PeerResponse);

  // Agent calls this to renew its mTLS certificate before expiry.
  // Requires a valid mTLS connection (CN must match agent_id).
  rpc RenewCert(RenewCertRequest) returns (RenewCertResponse);
}

// ─────────────────────────────────────────────────────────
// Agent ↔ Agent  (P2P relay mesh)
// ─────────────────────────────────────────────────────────

service DirQRelay {
  // Downstream agent connects to upstream peer. Bidirectional stream for
  // relaying queries down and results up.
  rpc RelayStream(stream AgentMessage) returns (stream ServerMessage);
}

// ─────────────────────────────────────────────────────────
// Messages: Registration
// ─────────────────────────────────────────────────────────

message RegisterRequest {
  string hostname     = 1;
  string os           = 2;  // "linux" or "windows"
  string os_version   = 3;  // e.g. "RHEL 9.2", "Windows Server 2022"
  string arch         = 4;  // e.g. "amd64", "arm64"
  string agent_version = 5;
  repeated string capabilities = 6; // supported query modules: "disk","cpu","memory",...
  string listen_addr  = 7;  // host:port this agent listens on for downstream peers
  map<string,string> tags = 8; // user-defined tags
  bool exec_enabled = 9;      // Phase 2: whether this agent accepts exec requests
  // Pre-shared secret for registration authentication. Server rejects
  // registrations that don't match DIRQ_REGISTRATION_SECRET.
  string registration_secret = 10;
}

message RegisterResponse {
  string agent_id       = 1;  // server-assigned unique ID
  AgentRole role        = 2;
  repeated PeerInfo peers = 3; // assigned upstream/sibling peers
  string zone_leader_addr = 4; // if this agent is not a zone leader, connect here
  int32 heartbeat_interval_seconds = 5;
  bytes server_signing_public_key = 6; // Ed25519 public key for signed control messages
  string server_signing_key_id = 7;    // identifier/fingerprint for the signing key
  // Fallback parent addresses, tried in order if primary parent fails.
  // Chosen from different branches for fault isolation.
  repeated string fallback_addrs = 8;
  // Session token: must be presented in AgentHello to authenticate the
  // stream connection. Prevents unauthenticated clients from impersonating agents.
  string session_token = 9;

  // mTLS: server-issued client certificate (PEM). The CN is the agent_id.
  // Agent must present this cert on all subsequent gRPC connections.
  bytes tls_client_cert = 10;
  bytes tls_client_key = 11;
  bytes tls_ca_cert = 12;

  // Previous signing keys still trusted during key rotation.
  repeated bytes server_signing_public_keys_old = 13;

  // Agent ID of the assigned parent relay (the owner of zone_leader_addr).
  // The connecting agent pins this against the parent's TLS certificate CN to
  // authenticate the parent's identity — not just that it holds a CA-issued
  // cert. Empty when this agent is a zone leader (it connects to the server,
  // whose identity is verified by the server cert's own SANs).
  string parent_id = 14;

  // Agent IDs of the fallback parents, index-aligned with fallback_addrs, so a
  // child pins a fallback's identity too when it fails over. Empty (or shorter
  // than fallback_addrs) means CA-only verification for the unmatched entries.
  repeated string fallback_ids = 15;
}

// ─────────────────────────────────────────────────────────
// Messages: Certificate renewal
// ─────────────────────────────────────────────────────────

message RenewCertRequest {
  string agent_id = 1;
}

message RenewCertResponse {
  bytes tls_client_cert = 1;  // new PEM cert
  bytes tls_client_key  = 2;  // new PEM key
  bytes tls_ca_cert     = 3;  // current CA bundle (may include new CA if rotated)
  // Updated signing keys (included if signing key was rotated since last renewal).
  bytes server_signing_public_key = 4;
  string server_signing_key_id = 5;
  repeated bytes server_signing_public_keys_old = 6;
}

enum AgentRole {
  AGENT_ROLE_UNSPECIFIED = 0;
  AGENT_ROLE_LEAF        = 1; // connects to a relay peer
  AGENT_ROLE_RELAY       = 2; // accepts downstream + connects upstream
  AGENT_ROLE_ZONE_LEADER = 3; // connects directly to the server
}

message PeerInfo {
  string agent_id = 1;
  string addr     = 2; // host:port
}

message PeerRequest {
  string agent_id = 1;
}

message PeerResponse {
  repeated PeerInfo peers = 2;
  string zone_leader_addr = 3;
  repeated string fallback_addrs = 4;
  // new_role lets the server promote a requesting agent in-band when the
  // tree is saturated and no parent has room.  When set to
  // AGENT_ROLE_ZONE_LEADER, the agent should reconnect directly to the
  // server (regardless of zone_leader_addr).  Unset (UNSPECIFIED) means
  // the agent's existing role is unchanged.
  AgentRole new_role = 5;

  // Agent ID of the assigned parent relay (owner of zone_leader_addr), pinned
  // against the parent's TLS cert CN. Empty when new_role promotes the agent
  // to zone leader (it connects to the server instead).
  string parent_id = 6;

  // Agent IDs of the fallback parents, index-aligned with fallback_addrs.
  repeated string fallback_ids = 7;
}

// ─────────────────────────────────────────────────────────
// Messages: Bidirectional stream (agent ↔ server/peer)
// ─────────────────────────────────────────────────────────

message AgentMessage {
  oneof payload {
    Heartbeat heartbeat           = 1;
    QueryResult query_result      = 2;
    AgentHello hello              = 3;
    ExecResponse exec_response    = 4;
    FileChunk file_chunk          = 5;
    FetchFileResponse fetch_response = 6;
    AggregatedQueryResult aggregated_result = 7; // batched results from subtree
    PeerDisconnected peer_disconnected = 8;      // child peer lost — propagate up
    DeployResponse deploy_response = 9;          // broadcast deploy result
    PeerConnected peer_connected = 10;           // child peer attached — propagate up
  }
}

// PeerDisconnected is sent upstream when a relay detects a child has
// disconnected. The server uses this to mark the agent (and its subtree)
// offline immediately, instead of waiting for heartbeat expiry.
message PeerDisconnected {
  string agent_id = 1; // the agent that disconnected
}

// PeerConnected is sent upstream when a relay accepts a new child via
// RelayStream.  The server uses this to mark the agent back online and
// commit its new parent assignment after a reattachment.  Without this
// signal, an agent that succeeds via a fallback parent stays
// erroneously offline in server topology because there is no other
// upstream-bound notification of the new attachment.
message PeerConnected {
  string agent_id = 1;  // the agent that attached
  string parent_id = 2; // the relay it attached to (the sender)
}

message ServerMessage {
  oneof payload {
    QueryRequest query_request    = 1;
    PeerUpdate peer_update        = 2;
    AgentUpdatePush update_push   = 3;
    ExecRequest exec_request      = 4; // Phase 2: run command on agent
    PutFileRequest put_file       = 5; // Phase 2: write file to agent
    FetchFileRequest fetch_file   = 6; // Phase 2: read file from agent
    DeployRequest deploy_request  = 11; // broadcast package deploy
    RotateCommand rotate_command  = 12; // certificate/key rotation push
  }
  string signer_key_id = 7;
  int64 signed_at_unix = 8;
  int64 expires_at_unix = 9;
  bytes signature = 10;
}

// RotateCommand is pushed through the mesh to trigger certificate or key
// rotation on all agents. Signed by the server (with the CURRENT key)
// so agents can verify it before acting.
message RotateCommand {
  enum RotationType {
    ROTATION_TYPE_UNSPECIFIED = 0;
    ROTATION_TYPE_AGENT_CERT = 1;    // renew your mTLS cert via RenewCert RPC
    ROTATION_TYPE_SIGNING_KEY = 2;   // update signing key verifier
    ROTATION_TYPE_CA = 3;            // fetch new CA bundle via RenewCert RPC
  }
  RotationType type = 1;
  string reason = 2;  // human-readable reason for audit log
  // For SIGNING_KEY rotation: new keys so agents can update without re-registering.
  bytes new_signing_public_key = 3;
  string new_signing_key_id = 4;
  repeated bytes old_signing_public_keys = 5;
  // Stagger window: each agent waits a random delay in [0, stagger_seconds)
  // before acting. Prevents thundering herd on RenewCert RPCs.
  // Default 0 means act immediately.
  int32 stagger_seconds = 6;
}

// Agent identifies itself when opening a stream.
message AgentHello {
  string agent_id = 1;
  repeated string capabilities = 2;
  bool exec_enabled = 3; // Phase 2: whether exec is enabled on this agent
  // Session token from RegisterResponse. Server and relay peers validate
  // this before accepting the stream.
  string session_token = 4;
}

message Heartbeat {
  string agent_id = 1;
  google.protobuf.Timestamp timestamp = 2;
  uint32 connected_peers = 3; // how many downstream peers this agent has
}

// ─────────────────────────────────────────────────────────
// Messages: Queries
// ─────────────────────────────────────────────────────────

message QueryRequest {
  string query_id   = 1;
  string raw_query  = 2; // the DirQ DSL expression
  // Pre-parsed for agents that do filtering:
  repeated string select_fields = 3;
  repeated string modules       = 4; // which modules to collect: "disk","cpu","memory"
  repeated Filter filters       = 5;
  int32 timeout_seconds         = 6;
  // Target agent IDs. If empty, all agents execute (broadcast).
  // If populated, only agents in this list execute; others just relay.
  repeated string target_agent_ids = 7;
}

message Filter {
  string field    = 1; // e.g. "disk.pct_used"
  string operator = 2; // e.g. ">", "=", "<", "!=", "LIKE"
  string value    = 3;
}

message QueryResult {
  string query_id   = 1;
  string agent_id   = 2;
  string hostname   = 3;
  bool   success    = 4;
  string error      = 5;
  google.protobuf.Struct data = 6; // structured JSON result
  google.protobuf.Timestamp collected_at = 7;
}

// AggregatedQueryResult carries batched results from a subtree.
// Relay agents and zone leaders buffer individual QueryResults from their
// children, then flush them as one aggregated message upstream. This reduces
// the number of messages the server receives from O(agents) to O(zone_leaders).
message AggregatedQueryResult {
  string query_id = 1;
  repeated QueryResult results = 2;
}

// ─────────────────────────────────────────────────────────
// Messages: Topology updates
// ─────────────────────────────────────────────────────────

message PeerUpdate {
  repeated PeerInfo new_peers = 1;
  AgentRole new_role          = 2;
  // Reconnect to this parent address. Agent should close the current
  // upstream connection and connect to this address instead.
  string new_parent_addr = 3;
  // Fallback addresses for the new parent.
  repeated string new_fallback_addrs = 4;
  // Target agent ID. If set, only the agent with this ID should apply
  // the update; other agents relay it downstream.
  string target_agent_id = 5;

  // Agent ID of the new parent relay (owner of new_parent_addr), pinned
  // against the parent's TLS cert CN. Empty when new_role promotes the agent
  // to zone leader.
  string new_parent_id = 6;

  // Agent IDs of the new fallback parents, index-aligned with new_fallback_addrs.
  repeated string new_fallback_ids = 7;
}

// ─────────────────────────────────────────────────────────
// Messages: Agent binary updates
// ─────────────────────────────────────────────────────────

message AgentUpdatePush {
  string version    = 1;
  bytes  binary     = 2; // the new agent binary (chunked in practice)
  bytes  signature  = 3; // Ed25519 signature
  string os         = 4; // target OS
  string arch       = 5; // target arch
}

// ─────────────────────────────────────────────────────────
// Phase 2: Remote execution
// ─────────────────────────────────────────────────────────

// ExecRequest asks the agent to run a command.
//
// Two modes:
//   - Point-to-point: agent_id is set, routed through mesh to one agent.
//   - Broadcast: target_agent_ids is set, relayed through tree like queries.
//     Each agent self-filters; only targeted agents execute.
message ExecRequest {
  string request_id    = 1;  // unique ID for this exec operation
  string agent_id      = 2;  // target agent (point-to-point mode)
  string command       = 3;  // command to execute (shell command string)
  bool   become        = 4;  // run with privilege escalation (sudo/runas)
  string become_user   = 5;  // user to become (default: root/Administrator)
  string become_method = 6;  // "sudo", "runas", etc.
  map<string,string> environment = 7; // extra env vars for the command
  int32  timeout_seconds = 8;
  // AAP attribution (for audit logging)
  string aap_job_id        = 9;
  string aap_job_template  = 10;
  string aap_user          = 11;
  // stdin data piped to the process. Required for Ansible modules — they
  // send Python module code via stdin.
  bytes  stdin = 12;
  // Script content. If set, agent writes to a temp file and executes it.
  // On Linux: preserves shebang, chmod +x, runs directly.
  // On Windows: writes as .ps1, runs with PowerShell.
  bytes  script = 13;
  // Original filename (e.g. "deploy.sh", "check.ps1"). Used to pick the
  // right temp extension and execution method.
  string script_name = 14;
  // Broadcast mode: if set, the request is relayed through the tree
  // like a query. Only agents in this list execute; others just relay.
  repeated string target_agent_ids = 15;
}

// ExecResponse returns the result of command execution.
message ExecResponse {
  string request_id  = 1;
  string agent_id    = 2;
  string hostname    = 3;
  int32  rc          = 4;  // exit code
  bytes  stdout      = 5;
  bytes  stderr      = 6;
  bool   success     = 7;
  string error       = 8;  // agent-level error (e.g. exec disabled, timeout)
  google.protobuf.Timestamp started_at  = 9;
  google.protobuf.Timestamp finished_at = 10;
}

// PutFileRequest asks the agent to write a file to disk.
message PutFileRequest {
  string request_id  = 1;
  string agent_id    = 2;
  string dest_path   = 3;  // absolute path on the agent
  bytes  content     = 4;  // file content (max 100MB default)
  int32  mode        = 5;  // unix file mode (e.g. 0644), ignored on Windows
  bool   become      = 6;
  string become_user = 7;
  // AAP attribution
  string aap_job_id       = 8;
  string aap_job_template = 9;
  string aap_user         = 10;
}

// FetchFileRequest asks the agent to read a file from disk and send it back.
message FetchFileRequest {
  string request_id  = 1;
  string agent_id    = 2;
  string src_path    = 3;  // absolute path on the agent
  bool   become      = 4;
  string become_user = 5;
  // AAP attribution
  string aap_job_id       = 6;
  string aap_job_template = 7;
  string aap_user         = 8;
}

// FetchFileResponse returns file content from the agent.
message FetchFileResponse {
  string request_id = 1;
  string agent_id   = 2;
  string hostname   = 3;
  bool   success    = 4;
  string error      = 5;
  bytes  content    = 6;
  int32  mode       = 7;  // original file mode
  int64  size       = 8;  // file size in bytes
}

// FileChunk is the acknowledgement for a PutFileRequest.
message FileChunk {
  string request_id = 1;
  string agent_id   = 2;
  string hostname   = 3;
  bool   success    = 4;
  string error      = 5;
}

// ─────────────────────────────────────────────────────────
// Broadcast deploy
// ─────────────────────────────────────────────────────────

// DeployRequest broadcasts a package through the relay mesh. Every agent
// relays the message to its children (like a query). Only agents whose ID
// is in target_agent_ids write the file and run the install command.
message DeployRequest {
  string request_id             = 1;
  repeated string target_agent_ids = 2; // agents that should install
  string dest_path              = 3;    // temp file path on agent
  bytes  content                = 4;    // package binary
  int32  mode                   = 5;    // unix file mode
  string install_command        = 6;    // e.g. "rpm -U /tmp/_dirq_deploy_xxx.rpm"
  bool   become                 = 7;
  string become_user            = 8;
  int32  timeout_seconds        = 9;
}

// DeployResponse is sent by each targeted agent after writing and installing.
message DeployResponse {
  string request_id  = 1;
  string agent_id    = 2;
  string hostname    = 3;
  bool   success     = 4;
  string error       = 5;
  string phase       = 6;  // "write" or "install"
  int32  rc          = 7;  // install exit code
  bytes  stdout      = 8;
  bytes  stderr      = 9;
}
