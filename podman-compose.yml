#
# DEVELOPMENT / SINGLE-HOST ONLY — not a fleet deployment.
#
# This stack publishes the server's gRPC port through podman's NAT, so the
# server sees agents' source IPs as podman-bridge addresses (10.89.0.x) and
# advertises those unroutable addresses to the mesh. That is fine on one
# machine (every container shares one bridge) but breaks a multi-host fleet:
# agents get a parent address they can't dial and loop on
# "dial tcp 10.89.0.x:50052: i/o timeout". For a real fleet, run the server
# natively or with host networking and persist /var/lib/dirq — see
# "Production Deployment" in README.md.

version: "3"

services:
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: dirq
      POSTGRES_PASSWORD: dirq
      POSTGRES_DB: dirq
    ports:
      - "5432:5432"
    volumes:
      - dirq-pgdata:/var/lib/postgresql/data

  dirq-server:
    build:
      context: .
      dockerfile: Containerfile
      target: server
    restart: on-failure
    environment:
      DIRQ_GRPC_ADDR: ":50051"
      DIRQ_HTTP_ADDR: ":8080"
      DIRQ_DB_URL: "postgres://dirq:dirq@postgres:5432/dirq?sslmode=disable"
      DIRQ_POD_ID: "dev-server-1"
      DIRQ_TLS_DISABLED: "true"
      DIRQ_AUTH_DISABLED: "true"
    ports:
      - "50051:50051"
      - "8090:8080"
    depends_on:
      - postgres

volumes:
  dirq-pgdata:
