# SPDX-License-Identifier: MIT
# Demo site playbook — runs through the DirQ mesh, not SSH

---
- name: Production health check
  hosts: all
  gather_facts: false

  tasks:
    - name: Get hostname
      raw: cat /etc/hostname
      register: host_result

    - name: Get uptime
      raw: cat /proc/uptime | awk '{print int($1/3600)"h "int(($1%3600)/60)"m"}'
      register: uptime_result

    - name: Check disk space
      raw: df -h / | tail -1
      register: disk_result

    - name: Check role marker
      raw: cat /etc/dirq-role 2>/dev/null || echo "unknown"
      register: role_result

    - name: Check installed packages
      raw: rpm -qa --qf '%{NAME}\n' | grep -E 'nginx|postgresql|curl' | sort | tr '\n' ' '
      register: pkg_result

    - name: Report
      debug:
        msg: >
          Host={{ host_result.stdout | trim }},
          Role={{ role_result.stdout | trim }},
          Uptime={{ uptime_result.stdout | trim }},
          Disk={{ disk_result.stdout | trim }},
          Packages={{ pkg_result.stdout | trim }}
