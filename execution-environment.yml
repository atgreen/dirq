#
# Ansible Execution Environment for AAP.
#
# This file is consumed by both CI (.github/workflows/ee.yml) and local
# devs. The atgreen.dirq collection is installed from a local tarball
# built from this workspace — not from Galaxy — so the EE always matches
# the tag that built it.
#
# Build steps:
#   1. (cd collection/atgreen/dirq && ansible-galaxy collection build --force)
#   2. cp collection/atgreen/dirq/atgreen-dirq-*.tar.gz ./atgreen-dirq.tar.gz
#   3. ansible-builder build -t dirq-ee:latest

version: 3

images:
  # community-ee-minimal is the upstream-equivalent of Red Hat's
  # ee-minimal-rhel9 (which requires a paid AAP subscription). It's the
  # canonical base for layering: Python + ansible-core + ansible-runner,
  # nothing else. Using awx-ee as a base is a known anti-pattern — it's a
  # kitchen-sink image with many pre-installed collections, and
  # ansible-builder ends up trying to re-resolve their transitive deps
  # (some of which need to be built from source). For AAP customers on
  # paid subscriptions, swap in
  #   registry.redhat.io/ansible-automation-platform-25/ee-minimal-rhel9
  base_image:
    name: quay.io/ansible/community-ee-minimal:latest

dependencies:
  galaxy: requirements.yml

additional_build_files:
  - src: atgreen-dirq.tar.gz
    dest: configs

additional_build_steps:
  prepend_galaxy:
    # Stage the local tarball where requirements.yml expects to find it,
    # before ansible-galaxy runs.
    - COPY _build/configs/atgreen-dirq.tar.gz /tmp/atgreen-dirq.tar.gz
  append_galaxy:
    - RUN rm -f /tmp/atgreen-dirq.tar.gz
  append_final:
    - LABEL org.opencontainers.image.source="https://github.com/atgreen/dirq"
    - LABEL org.opencontainers.image.description="DirQ Ansible Execution Environment"
    - LABEL org.opencontainers.image.licenses="MIT"
