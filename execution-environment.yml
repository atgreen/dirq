#
# Build a custom Execution Environment for AAP that includes the DirQ collection.
#
# Usage:
#   ansible-builder build -t dirq-ee:latest -f execution-environment.yml
#
# Then push to your container registry and add as an EE in AAP.

version: 3

build_arg_defaults:
  ANSIBLE_GALAXY_CLI_COLLECTION_OPTS: "--pre"

dependencies:
  galaxy:
    collections:
      - name: atgreen.dirq
        version: ">=1.0.0"

additional_build_steps:
  append_final:
    - RUN echo "DirQ Execution Environment ready"
