#
# Ansible Execution Environment for AAP.
#
# This file is consumed by both CI (.github/workflows/ee.yml) and local
# devs. The atgreen.dirq collection is installed from a local tarball
# built from this workspace — not from Galaxy — so the EE always matches
# the tag that built it.
#
# Build steps:
#   1. (cd collection/atgreen/dirq && ansible-galaxy collection build --force)
#   2. cp collection/atgreen/dirq/atgreen-dirq-*.tar.gz ./atgreen-dirq.tar.gz
#   3. ansible-builder build -t dirq-ee:latest

version: 3

images:
  # Red Hat's Universal Base Image 9 — explicitly published as the base
  # to build derived images from, no subscription required, pullable
  # anonymously from Docker Hub. This is the canonical base in the
  # upstream ansible-builder documentation. Ansible itself is installed
  # by the dependencies block below; ansible-builder handles the dnf
  # install of python3.11 first.
  #
  # Why not the obvious-sounding awx-ee / community-ee-minimal? Those are
  # finished EE images meant to be CONSUMED, not built upon — layering
  # ansible-builder on top of them either re-resolves their pre-installed
  # collections' transitive deps (which need gcc) or hits the wrong
  # access controls. AAP subscribers can swap in
  #   registry.redhat.io/ansible-automation-platform-25/ee-minimal-rhel9
  # which is the supported Red Hat equivalent.
  base_image:
    name: docker.io/redhat/ubi9:latest

dependencies:
  python_interpreter:
    package_system: python3.11
    python_path: /usr/bin/python3.11
  ansible_core:
    package_pip: ansible-core
  ansible_runner:
    package_pip: ansible-runner
  galaxy: requirements.yml

additional_build_files:
  - src: atgreen-dirq.tar.gz
    dest: configs

additional_build_steps:
  prepend_galaxy:
    # Stage the local tarball where requirements.yml expects to find it,
    # before ansible-galaxy runs.
    - COPY _build/configs/atgreen-dirq.tar.gz /tmp/atgreen-dirq.tar.gz
  append_galaxy:
    - RUN rm -f /tmp/atgreen-dirq.tar.gz
  append_final:
    - LABEL org.opencontainers.image.source="https://github.com/atgreen/dirq"
    - LABEL org.opencontainers.image.description="DirQ Ansible Execution Environment"
    - LABEL org.opencontainers.image.licenses="MIT"
